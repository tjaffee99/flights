<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flight Atlas</title>
<meta name="description" content="Every passenger air route in the world on a globe, each drawn by how many people fly it in a year. Click an airport to see everywhere you can fly nonstop from it.">
<meta name="theme-color" content="#F2F0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2124" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Flight Atlas">
<meta property="og:description" content="Every passenger air route in the world, drawn by how many people fly it in a year.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://flights.theojaffee.net/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="map" aria-label="Globe of the world's flight routes"></div>
  <aside id="panel" aria-label="Airports and routes">
    <button class="grip" id="grip" aria-label="Expand or collapse panel"></button>
    <div class="phead" id="phead">
      <div class="search-row"><div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Airport, city or airline" aria-label="Search airports by name, city, country or code">
        <button id="qclear" aria-label="Clear search">✕</button>
      </div>
      <button class="pbtn" id="optsbtn" aria-label="Map options" title="Map options" aria-expanded="false" aria-controls="mapopts"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4.5h7M12.5 4.5H14M2 11.5h1.5M7 11.5h7"/><circle cx="10.8" cy="4.5" r="1.7"/><circle cx="5.2" cy="11.5" r="1.7"/></svg></button>
      <button class="pbtn" id="collapse" aria-label="Hide panel" title="Hide panel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><path d="M6 2.5v11M10.5 6 8.5 8l2 2"/></svg></button></div>
      <div class="mapopts" id="mapopts" role="group" aria-label="Map options" hidden>
        <div class="orow"><span>Flight paths</span><button class="switch" id="lines" role="switch" aria-checked="true" aria-label="Flight paths"><i aria-hidden="true"></i></button></div>
        <div class="orow needs-lines"><span>Routes</span><span class="seg" role="group" aria-label="Busiest routes only"><button data-min="0" aria-pressed="true">All</button><button data-min="100000" aria-pressed="false">100K+</button><button data-min="1000000" aria-pressed="false">1M+</button></span></div>
        <div class="orow needs-lines"><span>Show</span><span class="chipset" role="group" aria-label="Kinds of route"><button class="chip" id="cdom" aria-pressed="true">Domestic</button><button class="chip" id="cintl" aria-pressed="true">International</button></span></div>
        <div class="orow"><span>Map</span><span class="seg" role="group" aria-label="Map projection"><button data-proj="globe" aria-pressed="true">Globe</button><button data-proj="mercator" aria-pressed="false">Flat</button></span></div>
        <div class="credits">Data: <a href="https://en.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a>, <a href="https://www.transtats.bts.gov/" target="_blank" rel="noopener">US DOT</a>, <a href="https://www.caa.co.uk/data-and-analysis/uk-aviation-market/airports/uk-airport-data/" target="_blank" rel="noopener">UK CAA</a>, <a href="https://ec.europa.eu/eurostat" target="_blank" rel="noopener">Eurostat</a>, <a href="https://www.gov.br/anac/" target="_blank" rel="noopener">ANAC</a>, <a href="https://www.bitre.gov.au/" target="_blank" rel="noopener">BITRE</a>, <a href="https://ourairports.com/" target="_blank" rel="noopener">OurAirports</a>.
          Map: <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.
          <a href="https://github.com/tjaffee99/flights#readme" target="_blank" rel="noopener">How this was made</a></div>
      </div>
    </div>
    <div id="body"></div>
  </aside>
  <button class="reopen" id="reopen" hidden aria-label="Show panel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><path d="M6 2.5v11M8.5 6l2 2-2 2"/></svg>Flight Atlas</button>
  <div id="tip" role="status" aria-live="polite"></div>
  <div id="loading"><div><span>Loading Flight Atlas…</span><span class="bar"><i></i></span></div></div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
